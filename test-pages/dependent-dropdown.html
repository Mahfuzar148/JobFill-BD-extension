<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cascading Dependent Dropdown Test — JobFill BD</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f0fdf4; padding:30px; color:#1e293b; }
    .card { max-width:600px; margin:0 auto; background:#ffffff; border:1px solid #bbf7d0; border-radius:12px; padding:24px; box-shadow:0 4px 15px rgba(0,0,0,0.05); }
    h2 { color:#15803d; font-size:18px; margin-bottom:6px; }
    p { font-size:12px; color:#64748b; margin-bottom:18px; }
    .row { margin-bottom:14px; }
    label { display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:#334155; }
    select { width:100%; border:1.5px solid #cbd5e1; border-radius:6px; padding:8px 12px; font-size:13px; outline:none; background:#ffffff; }
    select:focus { border-color:#16a34a; }
    .log-box { margin-top:20px; background:#0f172a; color:#38bdf8; font-family:monospace; font-size:11px; padding:12px; border-radius:6px; max-height:160px; overflow-y:auto; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Cascading Dependent Dropdown Simulation</h2>
    <p>Tests real-time reactive selection: Division ➔ District ➔ Upazila</p>

    <div class="row">
      <label>1. Division (বিভাগ)</label>
      <select id="present_division" name="present_division">
        <option value="">-- Select Division --</option>
        <option value="Dhaka">Dhaka (ঢাকা)</option>
        <option value="Chittagong">Chittagong (চট্টগ্রাম)</option>
        <option value="Rajshahi">Rajshahi (রাজশাহী)</option>
      </select>
    </div>

    <div class="row">
      <label>2. District (জেলা — Dependent on Division)</label>
      <select id="present_district" name="present_district" disabled>
        <option value="">-- Select Division First --</option>
      </select>
    </div>

    <div class="row">
      <label>3. Upazila / Thana (উপজেলা/থানা — Dependent on District)</label>
      <select id="present_upazila" name="present_upazila" disabled>
        <option value="">-- Select District First --</option>
      </select>
    </div>

    <div class="log-box" id="logBox">Event log will appear here...</div>
  </div>

  <script>
    const data = {
      Dhaka: {
        Dhaka: ['Mirpur', 'Mohammadpur', 'Dhanmondi', 'Gulshan', 'Uttara', 'Savar'],
        Gazipur: ['Gazipur Sadar', 'Kaliakair', 'Kapasia', 'Sreepur'],
        Narayanganj: ['Narayanganj Sadar', 'Bandar', 'Rupganj', 'Sonargaon']
      },
      Chittagong: {
        Chittagong: ['Kotwali', 'Panchlaish', 'Pahartali', 'Hathazari', 'Sitakunda'],
        CoxsBazar: ['Coxs Bazar Sadar', 'Chakaria', 'Teknaf', 'Ramu']
      },
      Rajshahi: {
        Rajshahi: ['Boalia', 'Motihar', 'Rajpara', 'Godagari', 'Paba'],
        Bogra: ['Bogra Sadar', 'Sherpur', 'Shibganj']
      }
    };

    const divSelect = document.getElementById('present_division');
    const distSelect = document.getElementById('present_district');
    const upzSelect = document.getElementById('present_upazila');
    const logBox = document.getElementById('logBox');

    function log(msg) {
      logBox.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    divSelect.addEventListener('change', () => {
      const divVal = divSelect.value;
      log(`Division changed to: ${divVal}`);
      distSelect.innerHTML = '<option value="">-- Select District --</option>';
      upzSelect.innerHTML = '<option value="">-- Select District First --</option>';
      upzSelect.disabled = true;

      if (data[divVal]) {
        distSelect.disabled = false;
        Object.keys(data[divVal]).forEach(dist => {
          const opt = document.createElement('option');
          opt.value = dist;
          opt.textContent = dist;
          distSelect.appendChild(opt);
        });
      } else {
        distSelect.disabled = true;
      }
    });

    distSelect.addEventListener('change', () => {
      const divVal = divSelect.value;
      const distVal = distSelect.value;
      log(`District changed to: ${distVal}`);
      upzSelect.innerHTML = '<option value="">-- Select Upazila --</option>';

      if (data[divVal] && data[divVal][distVal]) {
        upzSelect.disabled = false;
        data[divVal][distVal].forEach(upz => {
          const opt = document.createElement('option');
          opt.value = upz;
          opt.textContent = upz;
          upzSelect.appendChild(opt);
        });
      } else {
        upzSelect.disabled = true;
      }
    });

    upzSelect.addEventListener('change', () => {
      log(`Upazila changed to: ${upzSelect.value}`);
    });
  </script>
  <!-- JobFill BD In-Page Assistant for Mock Testing -->
  <link rel="stylesheet" href="../content.css">
  <script src="../content.js"></script>
</body>
</html>
